name: Build MOAMOA Manager (Windows)
on:
  workflow_dispatch:
  push:
    paths:
      - "manager/**"
      - ".github/workflows/build-manager-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt
      - name: Build Windows executable
        working-directory: manager
        run: pyinstaller --noconfirm --clean --windowed --name "MOAMOA-Manager" --collect-all keyring --hidden-import=services --paths . main.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path manager/dist/MOAMOA-Manager -DestinationPath MOAMOA-Manager-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MOAMOA-Manager-Windows
          path: MOAMOA-Manager-Windows.zip
          retention-days: 14
