name: Publish MOAMOA Manager Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.1.0; do not include v)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt
      - name: Build Windows executable
        working-directory: manager
        run: pyinstaller --noconfirm --clean --windowed --name "MOAMOA-Manager" --collect-all keyring --hidden-import=services --paths . main.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path manager/dist/MOAMOA-Manager -DestinationPath MOAMOA-Manager-Windows.zip -Force
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          $title = "MOAMOA Manager v${{ inputs.version }}"
          $notes = "MOAMOA Manager Windows build. Download the ZIP, extract it, and run MOAMOA-Manager.exe."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag MOAMOA-Manager-Windows.zip --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --title $title --notes $notes
          } else {
            gh release create $tag MOAMOA-Manager-Windows.zip --title $title --notes $notes
          }
