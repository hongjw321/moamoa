<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f6"><meta name="description" content="모아모아 계정으로 로그인하고 나만의 캐릭터 컬렉션을 안전하게 보관하세요."><title>로그인·회원가입 | MOAMOA</title><link rel="stylesheet" href="styles.css?v=20261127c"></head>
<body><header class="top"><a class="brand" href="index.html"><span><b>MOAMOA</b><small>Collect Your Little Friends!</small></span></a><button class="hamb" id="hamb" aria-label="메뉴 열기">MENU</button><nav id="nav"><a href="index.html">홈</a><a href="gacha.html">무료 뽑기</a><a href="collection.html">캐릭터 도감</a><a href="shop.html">샵</a><a href="event.html">이벤트</a><a href="mypage.html">마이페이지</a></nav></header>
<main><section class="section auth-section"><div class="auth-card"><span class="eyebrow">YOUR LITTLE WORLD</span><h1>모아모아 계정</h1><p class="auth-intro">로그인하고 소중한 친구들을 여러 기기에서 이어서 모아보세요.</p>
<div id="cloudNotice" class="auth-notice" role="status">클라우드 연결 상태를 확인하고 있어요.</div>
<div id="authForms"><div class="auth-tabs"><button type="button" class="auth-tab active" data-mode="login">로그인</button><button type="button" class="auth-tab" data-mode="signup">회원가입</button></div>
<form id="authForm"><div id="signupFields" hidden><div class="signup-grid"><div><label for="fullName">이름</label><input id="fullName" type="text" autocomplete="name" placeholder="이름을 입력해 주세요" maxlength="40"></div><div><label for="nickname">닉네임</label><input id="nickname" type="text" autocomplete="nickname" placeholder="모아모아에서 사용할 닉네임" maxlength="20"></div><div><label for="phone">휴대폰 번호 <small>(선택)</small></label><input id="phone" type="tel" autocomplete="tel" placeholder="010-1234-5678" maxlength="20"></div><div class="signup-wide"><label for="address">주소 <small>(선택 · 배송 기능 준비 시 사용)</small></label><input id="address" type="text" autocomplete="street-address" placeholder="주소를 입력해 주세요" maxlength="160"></div></div><p class="signup-hint">이름과 닉네임만 필수예요. 휴대폰 번호와 주소는 필요한 경우에만 입력해 주세요.</p></div><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상 입력" required><button class="btn pink full" id="authSubmit" type="submit">로그인</button></form>
<button type="button" class="auth-reset" id="resendConfirmation">인증 메일 다시 보내기</button><button type="button" class="auth-reset" id="resetPassword">비밀번호 재설정</button></div>
<div id="signedInPanel" hidden><p id="signedInEmail"></p><p class="auth-success">계정에 연결되어 있어요. 컬렉션과 출석 기록을 동기화합니다.</p><button type="button" class="btn light full" id="signOut">로그아웃</button></div>
<p id="authMessage" class="auth-message" aria-live="polite"></p><a class="auth-back" href="mypage.html">마이페이지로 돌아가기</a></div></section></main>
<footer><b>MOAMOA</b><span>작은 행운을 모으는 곳, 모아모아</span><small>© 2026 MOAMOA · Demo</small></footer>
<script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><script src="supabase-config.js?v=20261127b"></script><script src="cloud-sync.js?v=20261127b"></script><script src="auth-page.js?v=20261127b"></script></body></html>
